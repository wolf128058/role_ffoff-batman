---
# CLEANUP OLD BATMANS BEFORE: dkms remove batman-adv/2020.1 --all
- name: Install deps of pri-source
  become: yes
  apt:
    update_cache: yes
    pkg:
      - bison
      - flex
      - libssl-dev
    state: present

- name: Install dkms and kernel-headers for batman-adv
  become: yes
  apt:
    update_cache: yes
    pkg:
      - dkms
      - "linux-headers-{{ ansible_facts['kernel'] }}"
      - "linux-modules-extra-{{ ansible_facts['kernel'] }}"
      - ifupdown
    state: present

- name: Reinstall current kernel headers for external module builds
  become: yes
  command: apt-get install --reinstall -y linux-headers-{{ ansible_facts['kernel'] | regex_replace('-generic$', '') }} linux-headers-{{ ansible_facts['kernel'] }}
  when: batman_reinstall_kernel_headers | bool

- name: Download and unzip batman
  become: yes
  unarchive:
    src: "{{ batman_download_url }}"
    dest: /usr/src/
    remote_src: yes

#TODO: TO-FIX this shold not be done like this
- name: Remove missing link in Makefile
  become: yes
  shell: sed -i '/+= selinux/s/^/# /' /usr/src/linux-headers-*-generic/scripts/Makefile
  when: batman_build_kernel_scripts | bool

- name: Build batman
  become: yes
  make:
    target: scripts
    chdir: "/usr/src/linux-headers-{{ ansible_facts['kernel'] }}"
  ignore_errors: yes
  changed_when: false
  when: batman_build_kernel_scripts | bool

- name: Remove broken batman-adv DKMS registrations
  become: yes
  shell: |
    set -eu
    shopt -s nullglob
    for source_link in /var/lib/dkms/batman-adv/*/source; do
      if [ -L "${source_link}" ] && [ ! -e "${source_link}" ]; then
        rm -rf "$(dirname "${source_link}")"
      elif [ -d "${source_link}" ] && [ ! -f "${source_link}/dkms.conf" ]; then
        rm -rf "$(dirname "${source_link}")"
      fi
    done
  args:
    executable: /bin/bash
  when: batman_cleanup_broken_dkms_entries | bool
  changed_when: false

- name: Write dkms config
  become: yes
  template:
    src: dkms.j2
    dest: /usr/src/batman-adv-{{batman_version}}/dkms.conf

- name: dkms add
  become: yes
  command: dkms add -m batman-adv -v {{batman_version}}
  register: ret
  failed_when: ret.rc != 0 and ret.rc != 3
  changed_when: ret.rc == 0

- name: Remove other batman-adv DKMS installs for current kernel
  become: yes
  shell: |
    set -eu
    shopt -s nullglob
    changed=0
    for version_dir in /var/lib/dkms/batman-adv/*; do
      version="$(basename "${version_dir}")"
      if [ "${version}" = "{{ batman_version }}" ]; then
        continue
      fi
      if dkms status -m batman-adv -v "${version}" | grep -q "{{ ansible_facts['kernel'] }}.*installed"; then
        dkms remove -m batman-adv -v "${version}" -k {{ ansible_facts['kernel'] }}
        changed=1
      fi
    done
    if [ "${changed}" = 1 ]; then
      echo changed
    fi
  args:
    executable: /bin/bash
  register: batman_dkms_remove_other_versions
  changed_when: "'changed' in batman_dkms_remove_other_versions.stdout"

- name: Remove stale DKMS install for current kernel before rebuild
  become: yes
  command: dkms remove -m batman-adv -v {{ batman_version }} -k {{ ansible_facts['kernel'] }}
  register: batman_dkms_remove
  failed_when: batman_dkms_remove.rc != 0 and "is not installed" not in batman_dkms_remove.stderr
  changed_when: batman_dkms_remove.rc == 0

- name: dkms build
  become: yes
  command: dkms build -m batman-adv -v {{ batman_version }} -k {{ ansible_facts['kernel'] }} --force

- name: dkms install
  become: yes
  command: dkms install -m batman-adv -v {{ batman_version }} -k {{ ansible_facts['kernel'] }} --force

- name: Ensure depmod cache is current for running kernel
  become: yes
  command: depmod -a {{ ansible_facts['kernel'] }}
  changed_when: false

- name: Inspect loaded batman-adv module
  become: yes
  command: modinfo batman_adv
  register: batman_modinfo
  changed_when: false
  failed_when:
    - "'version:        ' ~ batman_version not in batman_modinfo.stdout"
    - "'vermagic:       ' ~ ansible_facts['kernel'] not in batman_modinfo.stdout"

- name: Prefer kernel-packaged batman-adv module for current kernel
  become: yes
  command: dkms remove -m batman-adv -v {{ batman_version }} -k {{ ansible_facts['kernel'] }}
  register: batman_dkms_prefer_in_tree_remove
  failed_when:
    - batman_dkms_prefer_in_tree_remove.rc != 0
    - "'is not installed' not in batman_dkms_prefer_in_tree_remove.stderr"
  changed_when: batman_dkms_prefer_in_tree_remove.rc == 0
  when: batman_prefer_in_tree_module | bool

- name: Refresh depmod cache after selecting batman-adv module
  become: yes
  command: depmod -a {{ ansible_facts['kernel'] }}
  changed_when: false
  when: batman_prefer_in_tree_module | bool

- name: Remove stale batman-adv module load config
  become: yes
  file:
    path: /etc/modules-load.d/batman-adv.module.conf
    state: absent

- name: add module load config
  become: yes
  template:
    src: module.j2
    dest: /etc/modules-load.d/{{ item }}.module.conf
  loop:
    - batman_adv
    - br_netfilter
    - dummy

- name: load br_netfilter module
  become: yes
  modprobe:
    name: br_netfilter
    state: present

- name: Unload mismatched batman module before loading configured version
  become: yes
  shell: |
    set -eu
    if [ -r /sys/module/batman_adv/version ] && [ "$(cat /sys/module/batman_adv/version)" != "{{ batman_version }}" ]; then
      modprobe -r batman_adv
      echo unloaded
    fi
  args:
    executable: /bin/bash
  register: batman_unload_mismatched_module
  changed_when: "'unloaded' in batman_unload_mismatched_module.stdout"

- name: load batman module
  become: yes
  modprobe:
    name: batman_adv
    state: present

- name: Ensure batman mesh interface uses configured routing mode
  become: yes
  command: batctl ra {{ batman_protocol_mode }}

- name: Install build deps of batctl
  become: yes
  apt:
    update_cache: yes
    pkg:
      - libnl-genl-3-dev
      - pkg-config
    state: present

- name: purge batctl package since we build the matching one
  become: yes
  apt:
    update_cache: yes
    pkg:
      - batctl
    state: absent

- name: Download and unzip batctl
  become: yes
  unarchive:
    src: "{{ batctl_download_url }}"
    dest: /usr/src/
    remote_src: yes

- name: Build batctl
  become: yes
  make:
    chdir: /usr/src/batctl-{{ batman_version }}

- name: copy batctl to get found
  become: yes
  copy:
    src: /usr/src/batctl-{{ batman_version }}/batctl
    dest: /usr/sbin/batctl
    owner: root
    group: root
    mode: '0755'
    remote_src: yes

- name: Check if batctl is available
  become: yes
  command: which batctl
  register: batctl_built
  changed_when: false
  failed_when: false

- name: Fallback - install batctl via apt if build failed
  become: yes
  apt:
    name: batctl
    state: present
  when: batctl_built.rc != 0

- name: Verify batctl is available
  become: yes
  command: which batctl
  register: batctl_check
  changed_when: false
  failed_when: batctl_check.rc != 0

- name: set batman to {{batman_protocol_mode}}
  become: yes
  command: batctl ra {{batman_protocol_mode}}

- name: Inspect active batman routing configuration
  become: yes
  command: batctl ra
  register: batman_routing_config
  changed_when: false

- name: Detect existing batman mesh interface routing mismatch
  ansible.builtin.set_fact:
    batman_meshif_routing_mismatch: >-
      {{
        ('* ' ~ ff_batman_meshif ~ ':') in batman_routing_config.stdout and
        ('* ' ~ ff_batman_meshif ~ ': ' ~ batman_protocol_mode) not in batman_routing_config.stdout
      }}

- name: Install bridge-utils
  become: yes
  apt:
    name: bridge-utils
    state: present

- name: forward bridged packages unseen
  become: yes
  sysctl:
    name: "{{ item }}"
    value: '0'
    state: present
  loop:
    - net.bridge.bridge-nf-call-arptables
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables

- name: Recreate batman mesh interface when routing mode mismatches
  become: yes
  shell: |
    set -eu
    systemctl stop ext-respondd.service unifi_respondd.service || true
    ifdown {{ ff_bridge_interface }} || true
    batctl meshif {{ ff_batman_meshif }} if del {{ ff_mesh_vpn_interface }} || true
    batctl meshif {{ ff_batman_meshif }} if del {{ ff_batman_dummy_interface }} || true
    ip link delete {{ ff_batman_meshif }} || true
    ip link delete {{ ff_batman_dummy_interface }} || true
    batctl ra {{ batman_protocol_mode }}
  args:
    executable: /bin/bash
  when: batman_meshif_routing_mismatch | bool

- name: "add bridge interface br-{{ item }}"
  become: yes
  template:
    src: br-community-segment.j2
    dest: "/etc/network/interfaces.d/90-br-{{ item }}"
  vars:
    community_segment: "{{ item }}"
  loop: "{{ community_segments | list() }}"
  tags:
    - vlan
    - vlans

- name: Trigger bring-up of configured Batman bridge interfaces
  become: yes
  shell: |
    set -eu
    if ifquery --state br-{{ item }} >/dev/null 2>&1; then
      echo already-up
      exit 0
    fi
    nohup ifup br-{{ item }} >/var/log/ifup-br-{{ item }}.log 2>&1 &
    echo started
  args:
    executable: /bin/bash
  register: batman_ifup
  changed_when: "'started' in batman_ifup.stdout"
  loop: "{{ community_segments | list() }}"
  tags:
    - vlan
    - vlans

- name: Wait for configured Batman bridge interfaces to exist
  become: yes
  command: ip link show br-{{ item }}
  register: batman_bridge_wait
  changed_when: false
  retries: 15
  delay: 1
  until: batman_bridge_wait.rc == 0
  loop: "{{ community_segments | list() }}"
  tags:
    - vlan
    - vlans

- name: Check if vxlan service is installed
  become: yes
  stat:
    path: /etc/systemd/system/vxlan.service
  register: vxlan_service_unit

- name: Re-run vxlan service after batman bridge changes
  become: yes
  ansible.builtin.systemd:
    name: vxlan.service
    state: restarted
  when: vxlan_service_unit.stat.exists

- name: Install systemd service for bridge interface
  become: yes
  template:
    src: br-interface.service.j2
    dest: "/etc/systemd/system/br-{{ item }}.service"
    owner: root
    group: root
    mode: '0644'
  vars:
    community_segment: "{{ item }}"
  loop: "{{ community_segments | list() }}"

- name: Reload systemd daemon
  become: yes
  systemd:
    daemon_reload: yes

- name: Enable bridge interface service
  become: yes
  systemd:
    name: "br-{{ item }}.service"
    enabled: yes
  loop: "{{ community_segments | list() }}"
